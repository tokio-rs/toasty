[package]
name = "example-store-operations"
version = "0.1.0"
authors.workspace = true
edition.workspace = true
license.workspace = true
readme.workspace = true
publish = false

[features]
default = [ "sqlite" ]
mysql = [ "toasty/mysql" ]
postgresql = [ "toasty/postgresql" ]
sqlite = [ "toasty/sqlite" ]

[dependencies]
toasty.workspace = true
toasty-core.workspace = true
# `#[tokio::main]` defaults to the multi-thread runtime, which the lean
# workspace tokio feature set (kept wasm-compatible for `toasty`) omits.
tokio = { workspace = true, features = ["rt-multi-thread"] }
uuid.workspace = true

[lints]
workspace = true
