[package]
name = "toasty-cli"
version = "0.11.0"
description = "Command-line interface for Toasty schema management"
authors.workspace = true
edition.workspace = true
homepage.workspace = true
keywords.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
categories.workspace = true
readme.workspace = true
documentation = "https://docs.rs/toasty-cli"

[[bin]]
name = "toasty"
path = "src/bin/toasty.rs"

[features]
default = ["sqlite", "postgresql", "mysql", "mariadb"]
sqlite = ["toasty/sqlite"]
postgresql = ["toasty/postgresql"]
mysql = ["toasty/mysql"]
mariadb = ["toasty/mariadb"]
turso = ["toasty/turso"]

[dependencies]
# Every optional column type is enabled so the CLI can decode whatever the
# user's project dumps.
toasty = { workspace = true, features = [
	"migration",
	"bigdecimal",
	"jiff",
	"net",
	"rust_decimal",
] }
toasty-core.workspace = true

anyhow = "1.0.102"
cargo_metadata.workspace = true
clap = { workspace = true, features = ["env"] }
console.workspace = true
dialoguer.workspace = true
hashbrown.workspace = true
jiff.workspace = true
libloading.workspace = true
rand.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
toml.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
